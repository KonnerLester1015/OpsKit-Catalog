<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Package · OpsKit Catalog</title>
  <meta name="description" content="An OpsKit script package: scripts, parameters, requirements, source code and download.">
  <meta name="opskit-repo" content="{{REPO_URL}}">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OpsKit Catalog">
  <meta property="og:title" content="Package · OpsKit Catalog">
  <meta property="og:description" content="An OpsKit script package: scripts, parameters, requirements, source code and download.">
  <meta property="og:url" content="{{BASE_URL}}package.html">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="{{BASE_URL}}package.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/site.css">
  <noscript><link rel="stylesheet" href="assets/css/noscript.css"></noscript>
  <script src="assets/js/theme.js"></script>
  <script type="module" src="assets/js/package.js"></script>
</head>
<body>
  {{HEADER:browse}}

  <main id="main" tabindex="-1">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="browse.html">Packages</a> › <span id="crumb-name" aria-current="page">Loading…</span></nav>
      <div id="package-root" class="loading-block" aria-busy="true" aria-live="polite">
        <p class="visually-hidden">Loading package…</p>
      </div>
      <noscript>
        <section class="panel" aria-label="JavaScript is off">
          <h1 class="panel-title">JavaScript is off</h1>
          <p>Package pages are built in your browser from <a href="catalog.json">catalog.json</a>. Without JavaScript you can read <a href="catalog.json">catalog.json</a> directly (each package has a download link and SHA-256) or <a href="{{REPO_URL}}/tree/{{BRANCH}}/packages">browse the packages on GitHub</a>.</p>
        </section>
      </noscript>
    </div>
  </main>

  {{FOOTER}}
</body>
</html>
