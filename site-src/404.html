<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <base href="{{BASE_PATH}}">
  <title>Page not found · OpsKit Catalog</title>
  <meta name="description" content="This page does not exist in the OpsKit Catalog.">
  <meta name="opskit-repo" content="{{REPO_URL}}">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OpsKit Catalog">
  <meta property="og:title" content="Page not found · OpsKit Catalog">
  <meta property="og:description" content="This page does not exist in the OpsKit Catalog.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/geist-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/site.css">
  <noscript><link rel="stylesheet" href="assets/css/noscript.css"></noscript>
  <script src="assets/js/theme.js"></script>
  <script type="module" src="assets/js/common.js"></script>
</head>
<body>
  {{HEADER}}

  <main id="main" tabindex="-1">
    <div class="container">
      <div class="page-head">
        <p class="big-code" aria-hidden="true">404</p>
        <h1>Page not found</h1>
        <p class="lead">That page doesn't exist. It may have moved, or the link has a typo.</p>
        <div class="hero-actions">
          <a class="button" href="browse.html">Browse packages</a>
          <a class="button secondary" href="catalog.json">Open catalog.json</a>
        </div>
      </div>
    </div>
  </main>

  {{FOOTER}}
</body>
</html>
